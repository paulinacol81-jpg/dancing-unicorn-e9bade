<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>15 Aniversario | La Reata de Oro</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      /* FONDO MÁRMOL */
      background-image: url("fondo marmol.png");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
    }

    /* =========================
       PORTADA
    ========================== */

    .portada {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: transparent;
    }

    .portada img {
  display: block;
  width: calc(100% - 24px);
  max-width: 900px;
  height: auto;
  margin: 12px auto;
  border-radius: 8px;
}

    /* =========================
       ESPACIO PARA CONTINUAR
    ========================== */

    .espacio-siguiente {
      min-height: 100vh;
      background: transparent;
    }

    .artista {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
}

.artista h2 {
  margin-bottom: 30px;
  font-family: Georgia, serif;
  font-size: 2rem;
  letter-spacing: 4px;
  color: #111;
}

/* CUERPO DEL CELULAR */
.telefono {
  position: relative;
  width: min(330px, 86vw);
  padding: 14px;
  background: #111;
  border-radius: 42px;

  box-shadow:
    0 18px 45px rgba(0, 0, 0, 0.35),
    0 0 0 3px #b8860b,
    0 0 0 6px #111;
}

/* VIDEO */
.telefono video {
  display: block;
  width: 100%;
  border-radius: 30px;
  background: #000;
}

/* PARTE SUPERIOR */
.telefono-superior {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);

  width: 110px;
  height: 24px;

  background: #111;
  border-radius: 0 0 16px 16px;

  z-index: 2;
}

.bocina {
  position: absolute;
  width: 40px;
  height: 5px;

  background: #333;
  border-radius: 10px;

  left: 50%;
  top: 8px;
  transform: translateX(-50%);
}

.camara {
  position: absolute;
  width: 7px;
  height: 7px;

  background: #222;
  border-radius: 50%;

  right: 18px;
  top: 7px;
}

/* DETALLE ABAJO */
.telefono-inferior {
  width: 90px;
  height: 5px;

  background: #333;
  border-radius: 10px;

  margin: 10px auto 2px;
}
    .telefono {
  position: relative;
  width: min(330px, 86vw);
  padding: 14px;
  background: #111;
  border-radius: 42px;

  box-shadow:
    0 18px 45px rgba(0, 0, 0, 0.35),
    0 0 0 3px #b8860b,
    0 0 0 6px #111;

  /* EFECTO DE ENTRADA */
  opacity: 0;
  transform: translateY(70px);
  transition:
    opacity 0.8s ease,
    transform 0.8s ease;
}

.telefono.visible {
  opacity: 1;
  transform: translateY(0);
}

  </style>
</head>


<body>

  <main>

    <!-- =====================
         PORTADA
    ====================== -->

    <section class="portada">

      <img
        src="portada.jpeg"
        alt="15 Aniversario La Reata de Oro"
      >

    </section>


    <!-- =====================
         AQUÍ CONTINUAREMOS
         CON LOS CANTANTES
    ====================== -->

    <section class="artista">

  <h2>EN VIVO</h2>

  <div class="telefono">

    <div class="telefono-superior">
      <span class="camara"></span>
      <span class="bocina"></span>
    </div>

    <video autoplay muted loop playsinline controls>
      <source src="cantante.mp4" type="video/mp4">
    </video>

    <div class="telefono-inferior"></div>

  </div>

</section>
    


  </main>

  <script>
  const telefono = document.querySelector('.telefono');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        telefono.classList.add('visible');
      }
    });
  }, {
    threshold: 0.25
  });

  observer.observe(telefono);
</script>
  

</body>

</html>

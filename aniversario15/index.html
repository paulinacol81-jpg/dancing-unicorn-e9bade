<head>

  <title>15 Aniversario | La Reata de Oro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;

  /* Fondo inspirado en la misma portada */
  background-image:
    linear-gradient(
      rgba(255, 250, 240, 0.72),
      rgba(255, 250, 240, 0.72)
    ),
    url("portada.jpeg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* PORTADA */
.portada {
  width: 100%;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  /* IMPORTANTE: ya no negro */
  background: transparent;
}

.portada img {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
}

/* Espacio para lo que agregaremos después */
.espacio-siguiente {
  min-height: 100vh;
  background: transparent;
}

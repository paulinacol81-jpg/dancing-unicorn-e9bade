<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>15 Aniversario | La Reata de Oro</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      /* FONDO MÁRMOL */
      background-image: url("fondo marmol.png");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
    }

    /* =========================
       PORTADA
    ========================== */

    .portada {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: transparent;
    }

    .portada img {
      display: block;

      width: 100%;
      max-width: 900px;
      height: auto;
    }

    /* =========================
       ESPACIO PARA CONTINUAR
    ========================== */

    .espacio-siguiente {
      min-height: 100vh;
      background: transparent;
    }

  </style>
</head>


<body>

  <main>

    <!-- =====================
         PORTADA
    ====================== -->

    <section class="portada">

      <img
        src="portada.jpeg"
        alt="15 Aniversario La Reata de Oro"
      >

    </section>


    <!-- =====================
         AQUÍ CONTINUAREMOS
         CON LOS CANTANTES
    ====================== -->

    <section class="espacio-siguiente">

    </section>


  </main>

</body>

</html>

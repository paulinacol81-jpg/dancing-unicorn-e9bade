<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>15 Aniversario | La Reata de Oro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #252525, #111, #050505);
    color: white;
    text-align: center;
    font-family: Georgia, serif;
    padding: 25px;
}

.contenido {
    max-width: 650px;
    animation: aparecer 1.5s ease;
}

.nombre {
    color: #d4af37;
    letter-spacing: 6px;
    font-size: 1rem;
    margin-bottom: 35px;
}

.numero {
    font-size: clamp(6rem, 20vw, 10rem);
    color: #d4af37;
    font-weight: normal;
    line-height: 1;
}

.aniversario {
    letter-spacing: 8px;
    font-size: 1.2rem;
    margin-top: 15px;
}

.linea {
    width: 100px;
    height: 1px;
    background: #d4af37;
    margin: 35px auto;
}

h2 {
    color: #d4af37;
    font-size: clamp(1.6rem, 5vw, 2.5rem);
    margin-bottom: 25px;
}

.mensaje {
    font-size: 1.1rem;
    line-height: 1.9;
    opacity: 0.9;
}

.final {
    color: #d4af37;
    margin-top: 35px;
    font-style: italic;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="contenido">

    <p class="nombre">LA REATA DE ORO</p>

    <h1 class="numero">15</h1>

    <p class="aniversario">ANIVERSARIO</p>

    <div class="linea"></div>

    <h2>¡GRACIAS POR ACOMPAÑARNOS!</h2>

    <p class="mensaje">
        Gracias por ser parte de esta celebración tan especial.
        <br><br>
        15 años de historia, tradición y momentos inolvidables
        que no serían posibles sin ustedes.
    </p>

    <p class="final">
        ¡Gracias por celebrar con nosotros!
    </p>

</div>

</body>
</html>

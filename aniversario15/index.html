  <script>
/* =========================
   ANIMACIÓN DE CELULARES
========================= */

const telefonos = document.querySelectorAll('.telefono');

const observer = new IntersectionObserver((entries) => {

  entries.forEach(entry => {

    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }

  });

}, {
  threshold: 0.25
});

telefonos.forEach(telefono => {
  observer.observe(telefono);
});


/* =========================
   CARRUSEL EL SULTÁN
========================= */

const slidesSultan =
  document.querySelectorAll('.slide-sultan');

const puntosSultan =
  document.querySelectorAll('.indicadores-sultan .punto');

let slideActualSultan = 0;

function mostrarSlideSultan(indice) {

  slidesSultan.forEach((slide, i) => {

    slide.classList.toggle('activo', i === indice);
    puntosSultan[i].classList.toggle('activo', i === indice);

    if (slide.tagName === 'VIDEO') {

      if (i === indice) {
        slide.currentTime = 0;
        slide.play().catch(() => {});
      } else {
        slide.pause();
      }

    }

  });

}


/* CUANDO TERMINA UN VIDEO */

slidesSultan.forEach((slide, indice) => {

  if (slide.tagName === 'VIDEO') {

    slide.addEventListener('ended', () => {

      slideActualSultan =
        (indice + 1) % slidesSultan.length;

      mostrarSlideSultan(slideActualSultan);

      /* Si llegamos a la foto,
         la mostramos 4 segundos */

      if (
        slidesSultan[slideActualSultan].tagName === 'IMG'
      ) {

        setTimeout(() => {

          slideActualSultan = 0;
          mostrarSlideSultan(slideActualSultan);

        }, 4000);

      }

    });

  }

});

    /* =========================
   DESLIZAR CARRUSEL SULTÁN
========================= */

const carruselSultan = document.querySelector('.carrusel-sultan');

let inicioX = 0;
let finX = 0;

function cambiarSlideSultan(direccion) {

  /* Detenemos el video actual */
  const actual = slidesSultan[slideActualSultan];

  if (actual.tagName === 'VIDEO') {
    actual.pause();
  }

  if (direccion === 'siguiente') {

    slideActualSultan =
      (slideActualSultan + 1) % slidesSultan.length;

  } else {

    slideActualSultan =
      (slideActualSultan - 1 + slidesSultan.length)
      % slidesSultan.length;

  }

  mostrarSlideSultan(slideActualSultan);
}


/* CELULAR / TOUCH */

carruselSultan.addEventListener('touchstart', (e) => {
  inicioX = e.touches[0].clientX;
}, { passive: true });

carruselSultan.addEventListener('touchend', (e) => {

  finX = e.changedTouches[0].clientX;

  const distancia = finX - inicioX;

  if (Math.abs(distancia) < 50) return;

  if (distancia < 0) {
    cambiarSlideSultan('siguiente');
  } else {
    cambiarSlideSultan('anterior');
  }

});


/* COMPUTADORA / MOUSE */

carruselSultan.addEventListener('mousedown', (e) => {
  inicioX = e.clientX;
});

carruselSultan.addEventListener('mouseup', (e) => {

  finX = e.clientX;

  const distancia = finX - inicioX;

  if (Math.abs(distancia) < 50) return;

  if (distancia < 0) {
    cambiarSlideSultan('siguiente');
  } else {
    cambiarSlideSultan('anterior');
  }

});

mostrarSlideSultan(0);

    /* =========================
   ANIMACIÓN RIFAS
========================= */

const chicaRegalo = document.querySelector('.chica-regalo');

const observerRegalo = new IntersectionObserver((entries) => {

  entries.forEach(entry => {

    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }

  });

}, {
  threshold: 0.25
});

observerRegalo.observe(chicaRegalo);

   /* =========================
   LUPA VIAJERA
========================= */

const lupa = document.getElementById('lupa');

const seccionesLupa = [

  /* MENÚ */
  {
    elemento: document.querySelector('.parada-menu'),
    objetivo: document.querySelector('.parada-menu'),
    x: '68%',
    y: '48%'
  },

  /* PARIS AGUILAR - NOMBRE */
  {
    elemento: document.querySelector('.artista .titulo-artista'),
    objetivo: document.querySelector('.objetivo-paris'),
    x: '58%',
    y: '30%'
  },

  /* EL SULTÁN - NOMBRE */
  {
    elemento: document.querySelector('.artista-sultan .titulo-artista'),
    objetivo: document.querySelector('.objetivo-sultan'),
    x: '58%',
    x: '58%',
    y: '30%'
  },

  /* RIFAS - CANASTA */
  {
    elemento: document.querySelector('.rifas'),
    objetivo: document.querySelector('.objetivo-canasta'),
    x: '62%',
    y: '58%'
  },

  /* RESERVACIONES */
  {
    elemento: document.querySelector('.reservaciones'),
    objetivo: document.querySelector('.reservaciones'),
    x: '68%',
    y: '68%'
  }

];


function moverLupa() {

  let seccionActual = -1;

  seccionesLupa.forEach((seccion, indice) => {

    if (!seccion.elemento) return;

    const rect =
      seccion.elemento.getBoundingClientRect();

    if (
      rect.top < window.innerHeight * 0.65 &&
      rect.bottom > window.innerHeight * 0.35
    ) {

      seccionActual = indice;

    }

  });


  /* SI TODAVÍA NO LLEGAMOS AL MENÚ */

  if (seccionActual === -1) {

    lupa.classList.remove('visible');
    return;

  }


  const destino = seccionesLupa[seccionActual];


/* QUITAMOS EL AUMENTO ANTERIOR */

document
  .querySelectorAll('.objetivo-lupa')
  .forEach(elemento => {
    elemento.classList.remove('aumentado');
  });


/* MOVEMOS LA LUPA */

lupa.classList.add('visible');

lupa.style.left = destino.x;
lupa.style.top = destino.y;


/* ACTIVAMOS EL OBJETIVO */

if (destino.objetivo) {

  destino.objetivo.classList.add('aumentado');
  lupa.classList.add('encontrado');

} else {

  lupa.classList.remove('encontrado');

}

}


window.addEventListener(
  'scroll',
  moverLupa,
  { passive: true }
);

window.addEventListener(
  'resize',
  moverLupa
);

moverLupa();

    /* =========================
   CONFETI FINAL
========================= */

const canvasConfeti = document.getElementById('confeti-final');
const ctxConfeti = canvasConfeti.getContext('2d');

let particulasConfeti = [];
let confetiLanzado = false;
let animacionConfeti;


function ajustarCanvasConfeti() {

  canvasConfeti.width = window.innerWidth;
  canvasConfeti.height = window.innerHeight;

}

ajustarCanvasConfeti();

window.addEventListener('resize', ajustarCanvasConfeti);


function crearConfeti() {

  particulasConfeti = [];

  for (let i = 0; i < 110; i++) {

    particulasConfeti.push({

      x: Math.random() * canvasConfeti.width,

      y: -Math.random() * canvasConfeti.height,

      ancho: 5 + Math.random() * 6,

      alto: 8 + Math.random() * 8,

      velocidadY: 2 + Math.random() * 3,

      velocidadX: -1 + Math.random() * 2,

      rotacion: Math.random() * Math.PI,

      giro: -0.08 + Math.random() * 0.16,

      color: Math.random() > 0.45
        ? '#d4af37'
        : '#111111'

    });

  }

}


function animarConfeti() {

  ctxConfeti.clearRect(
    0,
    0,
    canvasConfeti.width,
    canvasConfeti.height
  );


  particulasConfeti.forEach(particula => {

    particula.y += particula.velocidadY;
    particula.x += particula.velocidadX;
    particula.rotacion += particula.giro;


    ctxConfeti.save();

    ctxConfeti.translate(
      particula.x,
      particula.y
    );

    ctxConfeti.rotate(particula.rotacion);

    ctxConfeti.fillStyle = particula.color;

    ctxConfeti.fillRect(
      -particula.ancho / 2,
      -particula.alto / 2,
      particula.ancho,
      particula.alto
    );

    ctxConfeti.restore();

  });


  animacionConfeti =
    requestAnimationFrame(animarConfeti);

}


function lanzarConfeti() {

  if (confetiLanzado) return;

  confetiLanzado = true;

  canvasConfeti.style.display = 'block';

  crearConfeti();
  animarConfeti();


  setTimeout(() => {

    cancelAnimationFrame(animacionConfeti);

    ctxConfeti.clearRect(
      0,
      0,
      canvasConfeti.width,
      canvasConfeti.height
    );

    canvasConfeti.style.display = 'none';

  }, 4000);

}


/* DETECTAR RESERVACIONES */

const observerConfeti =
  new IntersectionObserver((entries) => {

    entries.forEach(entry => {

      if (entry.isIntersecting) {
        lanzarConfeti();
      }

    });

  }, {
    threshold: 0.35
  });


observerConfeti.observe(
  document.querySelector('.reservaciones')
);

    /* =========================
   ABRIR INVITACIÓN
========================= */

const entradaInvitacion =
  document.getElementById('entradaInvitacion');

const abrirInvitacion =
  document.getElementById('abrirInvitacion');


/* Evita que la invitación de atrás se mueva
   mientras está cerrada */

document.body.style.overflow = 'hidden';


abrirInvitacion.addEventListener('click', () => {

  /* Desaparece sello/texto y empiezan a abrirse
     las dos puertas */

  entradaInvitacion.classList.add('abriendo');


  /* Permitimos scroll nuevamente */

  document.body.style.overflow = '';


  /* Cuando termina la animación
     quitamos completamente la entrada */

  setTimeout(() => {

    entradaInvitacion.style.display = 'none';

  }, 1700);

});

</script>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>15 Aniversario | La Reata de Oro</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      /* FONDO MÁRMOL */
      background-image: url("fondo marmol.png");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
    }

    /* =========================
       PORTADA
    ========================== */

    .portada {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: transparent;
    }

    .portada img {
  display: block;
  width: calc(100% - 24px);
  max-width: 900px;
  height: auto;
  margin: 12px auto;
  border-radius: 8px;
}

    /* =========================
       ESPACIO PARA CONTINUAR
    ========================== */

    .espacio-siguiente {
      min-height: 100vh;
      background: transparent;
    }

    .artista {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
}


/* CUERPO DEL CELULAR */
.telefono {
  position: relative;
  width: min(330px, 86vw);
  padding: 14px;
  background: #111;
  border-radius: 42px;

  box-shadow:
    0 18px 45px rgba(0, 0, 0, 0.35),
    0 0 0 3px #b8860b,
    0 0 0 6px #111;
}

/* VIDEO */
.telefono video {
  display: block;
  width: 100%;
  border-radius: 30px;
  background: #000;
}

/* PARTE SUPERIOR */
.telefono-superior {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);

  width: 110px;
  height: 24px;

  background: #111;
  border-radius: 0 0 16px 16px;

  z-index: 2;
}

.bocina {
  position: absolute;
  width: 40px;
  height: 5px;

  background: #333;
  border-radius: 10px;

  left: 50%;
  top: 8px;
  transform: translateX(-50%);
}

.camara {
  position: absolute;
  width: 7px;
  height: 7px;

  background: #222;
  border-radius: 50%;

  right: 18px;
  top: 7px;
}

/* DETALLE ABAJO */
.telefono-inferior {
  width: 90px;
  height: 5px;

  background: #333;
  border-radius: 10px;

  margin: 10px auto 2px;
}
    .telefono {
  position: relative;
  width: min(330px, 86vw);
  padding: 14px;
  background: #111;
  border-radius: 42px;

  box-shadow:
    0 18px 45px rgba(0, 0, 0, 0.35),
    0 0 0 3px #b8860b,
    0 0 0 6px #111;

  /* EFECTO DE ENTRADA */
  opacity: 0;
  transform: translateY(70px);
  transition:
    opacity 0.8s ease,
    transform 0.8s ease;
}

.telefono.visible {
  opacity: 1;
  transform: translateY(0);
}

    /* =========================
   MENÚ
========================= */

.menu-evento {
  width: 100%;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 50px 20px;
}

.menu-evento img {
  display: block;

  width: min(650px, 92vw);
  height: auto;

  border-radius: 8px;

  box-shadow:
    0 15px 40px rgba(0, 0, 0, 0.25);
}

    .titulo-artista {
  text-align: center;
  margin-bottom: 30px;
}

.titulo-artista span {
  display: block;
  font-family: Georgia, serif;
  font-size: 1rem;
  letter-spacing: 5px;
  margin-bottom: 8px;
}

.titulo-artista h2 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 2rem;
  letter-spacing: 4px;
  color: #111;
}

    /* =========================
   CARRUSEL EL SULTÁN
========================= */

.carrusel-sultan {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  border-radius: 30px;
  background: #000;
}

.slide-sultan {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  opacity: 0;
  transition: opacity 0.8s ease;
}

.slide-sultan.activo {
  opacity: 1;
  z-index: 1;
}

.indicadores-sultan {
  display: flex;
  justify-content: center;
  gap: 7px;

  margin: 10px 0 4px;
}

.punto {
  width: 7px;
  height: 7px;

  border-radius: 50%;
  background: #555;

  transition: 0.3s;
}

.punto.activo {
  background: #d4af37;
  transform: scale(1.25);
}

    .carrusel-sultan {
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
}

.carrusel-sultan:active {
  cursor: grabbing;
}

  </style>
</head>


<body>

  <main>

    <!-- =====================
         PORTADA
    ====================== -->

    <section class="portada">

      <img
        src="portada.jpeg"
        alt="15 Aniversario La Reata de Oro"
      >

    </section>


    <!-- =====================
         AQUÍ CONTINUAREMOS
         CON LOS CANTANTES
    ====================== -->

    <!-- =====================
     MENÚ
====================== -->

<section class="menu-evento">

  <img
    src="menu.jpeg"
    alt="Menú 15 Aniversario La Reata de Oro"
  >

</section>

    

    <section class="artista">

  <div class="titulo-artista">
  <span>EN VIVO</span>
  <h2>PARIS AGUILAR</h2>
</div>

  <div class="telefono">

    <div class="telefono-superior">
      <span class="camara"></span>
      <span class="bocina"></span>
    </div>

    <video autoplay muted loop playsinline controls>
      <source src="cantante.mp4" type="video/mp4">
    </video>

    <div class="telefono-inferior"></div>

  </div>

</section>

    <!-- =====================
     EL SULTÁN
====================== -->

<section class="artista artista-sultan">

  <div class="titulo-artista">
    <span>EN VIVO</span>
    <h2>EL SULTÁN</h2>
  </div>

  <div class="telefono telefono-carrusel">

    <div class="telefono-superior">
      <span class="camara"></span>
      <span class="bocina"></span>
    </div>

    <div class="carrusel-sultan">

      <img
        class="slide-sultan"
        src="sultan1.jpeg"
        alt="El Sultán"
      >
      
      <video class="slide-sultan activo" muted playsinline>
        <source src="sultan_V1.mp4" type="video/mp4">
      </video>

      <video class="slide-sultan" muted playsinline>
        <source src="sultan_V2.mp4" type="video/mp4">
      </video>

      <video class="slide-sultan" muted playsinline>
        <source src="sultan_V3.mp4" type="video/mp4">
      </video>

      

    </div>

    <div class="indicadores-sultan">
      <span class="punto activo"></span>
      <span class="punto"></span>
      <span class="punto"></span>
      <span class="punto"></span>
    </div>

    <div class="telefono-inferior"></div>

  </div>

</section>
    
    


  </main>

  <script>
/* =========================
   ANIMACIÓN DE CELULARES
========================= */

const telefonos = document.querySelectorAll('.telefono');

const observer = new IntersectionObserver((entries) => {

  entries.forEach(entry => {

    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }

  });

}, {
  threshold: 0.25
});

telefonos.forEach(telefono => {
  observer.observe(telefono);
});


/* =========================
   CARRUSEL EL SULTÁN
========================= */

const slidesSultan =
  document.querySelectorAll('.slide-sultan');

const puntosSultan =
  document.querySelectorAll('.indicadores-sultan .punto');

let slideActualSultan = 0;

function mostrarSlideSultan(indice) {

  slidesSultan.forEach((slide, i) => {

    slide.classList.toggle('activo', i === indice);
    puntosSultan[i].classList.toggle('activo', i === indice);

    if (slide.tagName === 'VIDEO') {

      if (i === indice) {
        slide.currentTime = 0;
        slide.play().catch(() => {});
      } else {
        slide.pause();
      }

    }

  });

}


/* CUANDO TERMINA UN VIDEO */

slidesSultan.forEach((slide, indice) => {

  if (slide.tagName === 'VIDEO') {

    slide.addEventListener('ended', () => {

      slideActualSultan =
        (indice + 1) % slidesSultan.length;

      mostrarSlideSultan(slideActualSultan);

      /* Si llegamos a la foto,
         la mostramos 4 segundos */

      if (
        slidesSultan[slideActualSultan].tagName === 'IMG'
      ) {

        setTimeout(() => {

          slideActualSultan = 0;
          mostrarSlideSultan(slideActualSultan);

        }, 4000);

      }

    });

  }

});

    /* =========================
   DESLIZAR CARRUSEL SULTÁN
========================= */

const carruselSultan = document.querySelector('.carrusel-sultan');

let inicioX = 0;
let finX = 0;

function cambiarSlideSultan(direccion) {

  /* Detenemos el video actual */
  const actual = slidesSultan[slideActualSultan];

  if (actual.tagName === 'VIDEO') {
    actual.pause();
  }

  if (direccion === 'siguiente') {

    slideActualSultan =
      (slideActualSultan + 1) % slidesSultan.length;

  } else {

    slideActualSultan =
      (slideActualSultan - 1 + slidesSultan.length)
      % slidesSultan.length;

  }

  mostrarSlideSultan(slideActualSultan);
}


/* CELULAR / TOUCH */

carruselSultan.addEventListener('touchstart', (e) => {
  inicioX = e.touches[0].clientX;
}, { passive: true });

carruselSultan.addEventListener('touchend', (e) => {

  finX = e.changedTouches[0].clientX;

  const distancia = finX - inicioX;

  if (Math.abs(distancia) < 50) return;

  if (distancia < 0) {
    cambiarSlideSultan('siguiente');
  } else {
    cambiarSlideSultan('anterior');
  }

});


/* COMPUTADORA / MOUSE */

carruselSultan.addEventListener('mousedown', (e) => {
  inicioX = e.clientX;
});

carruselSultan.addEventListener('mouseup', (e) => {

  finX = e.clientX;

  const distancia = finX - inicioX;

  if (Math.abs(distancia) < 50) return;

  if (distancia < 0) {
    cambiarSlideSultan('siguiente');
  } else {
    cambiarSlideSultan('anterior');
  }

});

mostrarSlideSultan(0);

</script>
  

</body>

</html>
